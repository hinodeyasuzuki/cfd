<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFD Voxel Editor</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <aside class="panel">
      <h1>CFD Voxel Editor</h1>
      <section>
        <h2>フィールド設定</h2>
        <div class="row">
          <label>X (横)
            <input id="nMeshX" type="number" min="2" max="40" value="10" />
          </label>
          <label>Y (高さ)
            <input id="nMeshY" type="number" min="2" max="40" value="6" />
          </label>
          <label>Z (奥行)
            <input id="nMeshZ" type="number" min="2" max="40" value="10" />
          </label>
        </div>
        <div class="row">
          <label>unitSize (m)
            <input id="unitSize" type="number" min="0.05" step="0.05" value="0.5" />
          </label>
          <button id="createField">フィールド作成</button>
        </div>
      </section>

      <section>
        <h2>ボクセル種類</h2>
        <div id="voxelButtons" class="voxel-buttons">
          <button type="button" class="voxel-button" data-type="1" data-color="#111827">空気</button>
          <button type="button" class="voxel-button" data-type="2" data-color="#8a5a44">床</button>
          <button type="button" class="voxel-button" data-type="3" data-color="#4a5568">天井</button>
          <button type="button" class="voxel-button" data-type="5" data-color="#d1d5db">壁</button>
          <button type="button" class="voxel-button" data-type="4" data-color="#a7d8ff">窓</button>
          <button type="button" class="voxel-button" data-type="6" data-color="#d1d5db">内壁</button>
          <button type="button" class="voxel-button" data-type="7" data-color="#ff8acb">家具</button>
          <button type="button" class="voxel-button" data-type="8" data-color="#f59e0b">エアコン</button>
          <button type="button" class="voxel-button" data-type="9" data-color="#ef4444">暖房器具</button>
        </div>
        <label class="checkbox">
          面の選択
          <select id="pickLayer">
            <option value="ray">クリック面</option>
            <option value="innerWall">壁の内側</option>
            <option value="floor1">床+1</option>
            <option value="floor2">床+2</option>
          </select>
        </label>
        <p class="hint">クリックで配置。INSIDEは表示しません。</p>
      </section>

      <section>
        <h2>シミュレーション対象</h2>
        <select id="ACtype">
          <option value="1">夏（冷房）</option>
          <option value="2" selected>冬（暖房）</option>
        </select>

        <h2>温度設定 (℃)</h2>
        <div class="row">
          <label>室内温度
            <input id="InsidePhi" type="number" min="0" max="40" step="0.5" value="30" />
          </label>
          <label>室外温度
            <input id="InletPhi" type="number" min="0" max="40" step="0.5" value="35" />
          </label>
        </div>
        <div class="row">
          <label>床温度
            <input id="FloorPhi" type="number" min="0" max="40" step="0.5" value="30" />
          </label>
          <label>障害物温度
            <input id="ObsPhi" type="number" min="0" max="40" step="0.5" value="30" />
          </label>
        </div>
      </section>

      <section>
        <h2>断熱性設定</h2>
        <div class="row">
          <label>窓の断熱性
            <select id="windowKset">
              <option value="6">シングルガラス</option>
              <option value="3">複層ガラス</option>
              <option value="1.5">low-eガラス</option>
            </select>
          </label>
          <label>壁の断熱性
            <select id="wallKset">
              <option value="2.5" selected>無断熱</option>
              <option value="1.0">30mm</option>
              <option value="0.6">50mm</option>
              <option value="0.3">100mm</option>
            </select>
          </label>
        </div>
      </section>

      <section>
        <h2>エアコン設定</h2>
        <div class="row">
          <label>風速
            <input id="ACwind" type="number" min="0" max="10" step="0.5" value="1" />
          </label>
          <label>風向き
            <select id="ACdir">
              <option value="1">下向き</option>
              <option value="2" selected>水平方向</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label class="checkbox">
            <input id="ACheat" type="checkbox" />
            エアコン暖房
          </label>
        </div>
      </section>


      <section>
        <h2>出力</h2>
        <div class="row">
          <button id="exportJson">JSON出力</button>
          <button id="saveJson">JSON保存</button>
          <button id="openSimulation">シミュレーション起動</button>
        </div>
        <textarea id="output" rows="10" readonly></textarea>
      </section>

      <section>
        <h2>操作</h2>
        <ul>
          <li>左ドラッグ: 視点回転</li>
          <li>右ドラッグ: 平行移動</li>
          <li>ホイール: ズーム</li>
          <li>セルクリック: 選択セルに配置</li>
        </ul>
      </section>
    </aside>

    <main class="viewport">
      <canvas id="scene"></canvas>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
